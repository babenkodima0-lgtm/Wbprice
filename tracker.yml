name: WB price tracker

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут
  workflow_dispatch:          # кнопка ручного запуска

permissions:
  contents: write             # нужно, чтобы сохранять prices.json в репозиторий

concurrency:
  group: wb-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Check public seller page
        run: |
          python - <<'PY'
          import requests

          url = "https://www.wildberries.ru/seller/25577"
          r = requests.get(
              url,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=20,
          )
          print("HTTP status:", r.status_code)
          print("HTML length:", len(r.text))
          print("Contains seller ID:", "25577" in r.text)
          PY
          
      - run: pip install requests

      - name: Run tracker
        env:
          RUN_ONCE: "1"
          WB_DEST: "123585931"   # Ханты-Мансийск
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WB_SELLER_ID: ${{ secrets.WB_SELLER_ID }}
          MIN_CHANGE_PCT: "1"
        run: python wb_price_tracker.py

      - name: Save prices
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add prices.json
          git diff --staged --quiet || (git commit -m "update prices" && git push)

      - name: Test Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=✅ Тест: GitHub Actions отправляет сообщения в Telegram" \
            --fail

