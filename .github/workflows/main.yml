
name: WB price tracker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wb-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check public seller page
        run: |
          python - <<'PY'
          import requests

          url = "https://www.wildberries.ru/seller/25577"
          try:
              r = requests.get(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"},
                  timeout=20,
              )
              print("HTTP status:", r.status_code)
              print("HTML length:", len(r.text))
              print("HTML preview:", r.text[:300])
              print("Final URL:", r.url)
              print("Response headers:", dict(r.headers))
              print("Full HTML:", r.text)
          except Exception as e:
              print("Request error:", repr(e))
          PY

      - name: Run tracker
        env:
          RUN_ONCE: "1"
          WB_DEST: "123585931"
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          WB_SELLER_ID: ${{ secrets.WB_SELLER_ID }}
          MIN_CHANGE_PCT: "1"
        run: python wb_price_tracker.py

      - name: Save prices
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add prices.json
          git diff --staged --quiet || (git commit -m "update prices" && git push)
